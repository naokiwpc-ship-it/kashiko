<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>かしこの塔</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かしこの塔">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1029">
<style>html,body{margin:0;padding:16px 10px 30px;background:#0a1029;min-height:100%}</style>
</head>
<body>
<style>
#game{max-width:460px;margin:0 auto;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#101a3a;border-radius:16px;padding:16px;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent;min-height:520px;box-sizing:border-box}
#game *{box-sizing:border-box}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:19px;font-weight:500;background:#2b4cb0;color:#fff;cursor:pointer;font-family:inherit;margin-top:10px}
.btn.sub{background:#22305e;font-size:15px;padding:11px}
.btn:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ans{border:2px solid #3d57a8;background:#1d2b5c;border-radius:12px;padding:20px 4px;font-size:27px;color:#fff;font-family:inherit;cursor:pointer}
.ans.ok{background:#14684a;border-color:#3fd69a}
.ans.ng{background:#6d1b2c;border-color:#e0607a}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9fb3e6}
.bar{height:9px;background:#22305e;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#e05a7a;transition:width .25s}
.q{font-size:33px;text-align:center;margin:16px 0 4px;letter-spacing:1px}
.c{text-align:center}
.sm{font-size:13px;color:#9fb3e6}
.big{font-size:23px;font-weight:500}
.zone{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;margin-bottom:4px;background:#182449;color:#8ea4dd}
.zone.now{background:#2b4cb0;color:#fff}
.zone.locked{opacity:.45}
.zone b{font-weight:500;font-size:14px}
.pop{animation:pop .3s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:sh .3s}@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}100%{transform:translateX(0)}}
.combo{color:#ffd24a;font-size:15px;height:20px;text-align:center}
.inp{width:100%;padding:13px;border-radius:10px;border:2px solid #3d57a8;background:#1d2b5c;color:#fff;font-size:18px;font-family:inherit}
.chest{font-size:14px;color:#ffd24a;text-align:center;margin-top:8px}
</style>
<div id="game"></div>
<script>
(function(){
var G=document.getElementById('game');
var ZONES=[[1,10,'1年生の森'],[11,20,'2年生の谷'],[21,30,'3年生の橋'],[31,40,'4年生のどうくつ'],[41,50,'5年生のみずうみ'],[51,60,'6年生の山'],[61,70,'中学の門'],[71,80,'高校のとう'],[81,90,'東大のとびら'],[91,100,'スタンフォードの空']];
var OPEN=40;
var GEAR=['きのぼう','ひかるぼうし','かぜのマント','いなずまのつえ','りゅうのたて','ほしのかんむり','じかんのとけい','ちしきのつるぎ'];
var FOE=['スライムン','コケゴン','カゼバネ','イワゴロ','ミズタマ','ホノオネコ','カミナリウサギ','カゲオオカミ','ヒカリドラゴン','ソラノヌシ'];
var S=null,slot=0,view='',snd=true;
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function sh(a){for(var i=a.length-1;i>0;i--){var j=r(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function beep(f,d,type){if(!snd)return;try{var c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('kashiko_v1'))||[null,null]}catch(e){return [null,null]}}
function saveAll(a){try{localStorage.setItem('kashiko_v1',JSON.stringify(a))}catch(e){}}
function save(){var a=load();a[slot]=S;saveAll(a)}
function newSave(name){return {name:name,floor:1,max:1,lv:1,exp:0,gear:[],days:1,last:today(),clears:0}}
function maxhp(){return 3+Math.floor(S.lv/3)}
function atk(){return 2+S.gear.length}
function zoneOf(f){for(var i=0;i<ZONES.length;i++)if(f<=ZONES[i][1])return ZONES[i];return ZONES[9]}

function makeQ(f){var a,b,c,t,ans;
 if(f<=4){a=r(1,8);b=r(1,9-a);t=a+' + '+b;ans=a+b}
 else if(f<=8){a=r(3,10);b=r(1,a-1);t=a+' - '+b;ans=a-b}
 else if(f<=12){a=r(5,9);b=r(11-a,9);t=a+' + '+b;ans=a+b}
 else if(f<=16){a=r(11,18);b=r(a-9,9);t=a+' - '+b;ans=a-b}
 else if(f<=20){a=r(2,5);b=r(2,9);t=a+' × '+b;ans=a*b}
 else if(f<=24){a=r(2,9);b=r(2,9);t=a+' × '+b;ans=a*b}
 else if(f<=28){a=r(2,9);b=r(2,9);t=(a*b)+' ÷ '+a;ans=b}
 else if(f<=32){if(r(0,1)){a=r(13,89);b=r(11,99-a);t=a+' + '+b;ans=a+b}else{a=r(25,99);b=r(11,a-1);t=a+' - '+b;ans=a-b}}
 else if(f<=36){if(r(0,1)){a=r(12,49);b=r(3,9);t=a+' × '+b;ans=a*b}else{b=r(3,9);c=r(2,9);var am=r(1,b-1);t=(b*c+am)+' ÷ '+b+' の あまり';ans=am}}
 else{if(r(0,1)){a=r(20,80);c=a+r(12,90);t=a+' + □ = '+c;ans=c-a}else{a=r(101,499);b=r(101,499);t=a+' + '+b;ans=a+b}}
 var s={},o=[ans];s[ans]=1;var g=0;
 while(o.length<4&&g++<80){var d=r(1,Math.max(3,Math.round(ans*0.25)));var v=ans+(r(0,1)?d:-d);if(v>=0&&!s[v]){s[v]=1;o.push(v)}}
 while(o.length<4){var v2=ans+o.length+1;if(!s[v2]){s[v2]=1;o.push(v2)}}
 return {t:t,ans:ans,ch:sh(o)}}

function foeSvg(f,hurt){var i=Math.min(9,Math.floor((f-1)/10));var col=['#5dcaa5','#97c459','#85b7eb','#b4b2a9','#5dcaa5','#ef9f27','#ffd24a','#af7fdd','#f0997b','#ffffff'][i];
 var y=hurt?6:0;
 return '<svg viewBox="0 0 120 100" width="150" height="125" aria-hidden="true"><ellipse cx="60" cy="'+(92)+'" rx="34" ry="6" fill="#0a1029"/><g transform="translate(0,'+y+')"><path d="M22 76 Q18 30 60 26 Q102 30 98 76 Z" fill="'+col+'"/><circle cx="46" cy="54" r="7" fill="#101a3a"/><circle cx="74" cy="54" r="7" fill="#101a3a"/><circle cx="48" cy="52" r="2.4" fill="#fff"/><circle cx="76" cy="52" r="2.4" fill="#fff"/><path d="M50 68 Q60 '+(hurt?60:76)+' 70 68" stroke="#101a3a" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>'}

function screenTitle(){view='title';
 G.innerHTML='<div class="c" style="padding:26px 0 6px"><div style="font-size:13px;color:#9fb3e6;letter-spacing:3px">100かいだての</div><div style="font-size:42px;font-weight:500;letter-spacing:2px;margin:4px 0">かしこの塔</div><div class="sm">てっぺんは、東大とスタンフォード</div></div>'
 +'<div class="c" style="margin:18px 0">'+foeSvg(1,false)+'</div>'
 +'<button class="btn" id="go">はじめる</button>'
 +'<div class="sm c" style="margin-top:14px">1かい ずつ のぼる。まちがえても、なんども いける。</div>';
 document.getElementById('go').onclick=screenSlots}

function screenSlots(){view='slots';var a=load();var h='<div class="big c" style="margin:10px 0 14px">だれが のぼる？</div>';
 for(var i=0;i<2;i++){var s=a[i];
  h+='<button class="btn" data-s="'+i+'" style="text-align:left">'+(s?('<span style="font-size:20px">'+s.name+'</span><span class="sm" style="float:right;line-height:28px">'+s.max+'かい・Lv'+s.lv+'</span>'):('<span style="opacity:.7">'+(i+1)+'人め　あたらしく はじめる</span>'))+'</button>';
  if(s)h+='<button class="btn sub" data-d="'+i+'" style="margin-top:4px;opacity:.55">'+s.name+' を けす</button>'}
 G.innerHTML=h;
 G.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){slot=+b.dataset.s;var q=load()[slot];if(q){S=q;checkDay();screenMap()}else screenName()}});
 G.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){var a2=load();a2[+b.dataset.d]=null;saveAll(a2);screenSlots()}})}

function screenName(){view='name';
 G.innerHTML='<div class="big c" style="margin:14px 0">なまえを いれてね</div><input class="inp" id="nm" maxlength="6" placeholder="ひらがな 6もじまで"><button class="btn" id="ok">この なまえで はじめる</button><button class="btn sub" id="bk">もどる</button>';
 var nm=document.getElementById('nm');nm.focus();
 document.getElementById('ok').onclick=function(){var v=(nm.value||'').trim()||'ぼうけんしゃ';S=newSave(v);save();screenMap()};
 document.getElementById('bk').onclick=screenSlots}

function checkDay(){var t=today();if(S.last!==t){var d1=new Date(S.last),d2=new Date(t);var gap=Math.round((d2-d1)/86400000);S.days=(gap===1)?S.days+1:1;S.last=t;save()}}

function screenMap(){view='map';
 var h='<div class="hud"><span>'+S.name+'　Lv'+S.lv+'</span><span>'+S.days+'日 れんぞく</span></div>';
 h+='<div class="big c" style="margin:12px 0 10px">いま '+S.floor+' かい</div>';
 for(var i=ZONES.length-1;i>=0;i--){var z=ZONES[i];var now=S.floor>=z[0]&&S.floor<=z[1];var lock=z[0]>OPEN;
  h+='<div class="zone'+(now?' now':'')+(lock?' locked':'')+'"><b>'+z[0]+'-'+z[1]+'</b> '+z[2]+(now?'　← いまここ':(lock?'　（とじている）':''))+'</div>'}
 h+='<button class="btn" id="up">'+S.floor+'かいに のぼる</button>';
 if(S.gear.length)h+='<div class="sm c" style="margin-top:12px">そうび：'+S.gear.join('・')+'（こうげき '+atk()+'）</div>';
 h+='<div class="sm c" style="margin-top:6px">さいこう '+S.max+'かい／たおした数 '+S.clears+'</div>';
 h+='<button class="btn sub" id="bk">べつの人に かわる</button>';
 G.innerHTML=h;
 document.getElementById('up').onclick=function(){S.floor>OPEN?screenGate():startFloor()};
 document.getElementById('bk').onclick=screenSlots}

function screenGate(){view='gate';
 G.innerHTML='<div class="c" style="padding:30px 0"><svg viewBox="0 0 80 100" width="88" height="110" aria-hidden="true"><rect x="10" y="8" width="60" height="88" rx="6" fill="#22305e" stroke="#ffd24a" stroke-width="3"/><circle cx="58" cy="54" r="4" fill="#ffd24a"/></svg><div class="big" style="margin:14px 0">'+ (OPEN+1) +'かいの とびらは、まだ かたい</div><div class="sm">つぎの版で ひらきます。<br>それまでに、そうびを あつめておこう。</div></div><button class="btn" id="re">'+OPEN+'かいを もういちど</button><button class="btn sub" id="bk">地図に もどる</button>';
 document.getElementById('re').onclick=function(){S.floor=OPEN;save();startFloor()};
 document.getElementById('bk').onclick=screenMap}

var B=null;
function startFloor(){var f=S.floor,boss=(f%5===0);
 B={f:f,boss:boss,hp:maxhp(),fhp:boss?20:10,fmax:boss?20:10,combo:0,best:0,n:0,ok:0};
 nextQ()}

function nextQ(){B.q=makeQ(B.f);draw()}

function draw(fx){var z=zoneOf(B.f);
 var hearts='';for(var i=0;i<maxhp();i++)hearts+=(i<B.hp?'<span style="color:#e0607a">♥</span>':'<span style="color:#3a4a7a">♥</span>');
 var h='<div class="hud"><span>'+B.f+'かい　'+z[2]+'</span><span>'+hearts+'</span></div>';
 h+='<div class="sm" style="margin-top:10px">'+(B.boss?'ボス ':'')+FOE[Math.min(9,Math.floor((B.f-1)/10))]+'</div><div class="bar"><i style="width:'+(B.fhp/B.fmax*100)+'%"></i></div>';
 h+='<div class="c '+(fx==='hit'?'pop':(fx==='miss'?'shake':''))+'" style="margin:6px 0">'+foeSvg(B.f,fx==='hit')+'</div>';
 h+='<div class="combo">'+(B.combo>=3?'かいしんの いちげき！　'+B.combo+'れんぞく':(B.combo===2?'あと1つで かいしん':''))+'</div>';
 h+='<div class="q">'+B.q.t+' = ?</div>';
 h+='<div class="grid">'+B.q.ch.map(function(v,i){return '<button class="ans" data-v="'+v+'">'+v+'</button>'}).join('')+'</div>';
 h+='<button class="btn sub" id="run">にげる</button>';
 G.innerHTML=h;
 G.querySelectorAll('.ans').forEach(function(b){b.onclick=function(){answer(+b.dataset.v,b)}});
 document.getElementById('run').onclick=function(){screenMap()}}

function answer(v,el){
 G.querySelectorAll('.ans').forEach(function(b){b.onclick=null});
 B.n++;
 if(v===B.q.ans){el.className='ans ok';beep(880,.08);B.combo++;B.ok++;if(B.combo>B.best)B.best=B.combo;
  var d=atk()*(B.combo>=3?2:1);B.fhp-=d;
  setTimeout(function(){if(B.fhp<=0)return winFloor();B.q=makeQ(B.f);draw('hit');},280)}
 else{el.className='ans ng';beep(160,.18,'sawtooth');B.combo=0;B.hp--;
  var t=G.querySelector('.q');if(t)t.innerHTML=B.q.t+' = <span style="color:#ffd24a">'+B.q.ans+'</span>';
  setTimeout(function(){if(B.hp<=0)return lose();B.q=makeQ(B.f);draw('miss');},1300)}}

function lose(){view='lose';
 G.innerHTML='<div class="c" style="padding:26px 0"><div class="big">にげかえった</div><div class="sm" style="margin-top:10px">'+B.f+'かいの まもの は つよかった。<br>けいけんちは きえない。もういちど いこう。</div></div><button class="btn" id="re">もういちど '+B.f+'かい</button><button class="btn sub" id="bk">地図に もどる</button>';
 document.getElementById('re').onclick=startFloor;
 document.getElementById('bk').onclick=screenMap}

function winFloor(){view='win';beep(660,.1);setTimeout(function(){beep(990,.16)},120);
 var ex=B.f*10+B.ok*5,up=false;S.exp+=ex;S.clears++;
 while(S.exp>=S.lv*100){S.exp-=S.lv*100;S.lv++;up=true}
 var got=null;
 if(B.boss){var idx=Math.floor(B.f/5)-1;if(idx>=0&&idx<GEAR.length&&S.gear.indexOf(GEAR[idx])<0){got=GEAR[idx];S.gear.push(got)}}
 S.floor=B.f+1;if(S.floor>S.max)S.max=S.floor;save();
 var h='<div class="c" style="padding:18px 0 4px"><div class="big">'+B.f+'かい クリア！</div>';
 h+='<div class="sm" style="margin-top:10px">けいけんち ＋'+ex+'　／　さいだい '+B.best+'れんぞく</div>';
 if(up)h+='<div style="color:#ffd24a;margin-top:10px;font-size:19px">レベルが '+S.lv+' に あがった！　♥が ふえた</div>';
 if(got)h+='<div style="color:#ffd24a;margin-top:10px;font-size:19px">たからばこ：'+got+' を てにいれた！</div>';
 h+='</div>';
 var nf=S.floor,nb=(nf%5===0);
 h+='<div class="chest">つぎは '+nf+'かい'+(nf>OPEN?'　…とびらが ある':(nb?'　★ボスが まっている':(Math.ceil(nf/5)*5-nf===1?'　つぎの つぎは ボス':'　たからばこまで あと '+(Math.ceil(nf/5)*5-nf)+'かい')))+'</div>';
 h+='<button class="btn" id="go">'+nf+'かいへ すすむ</button><button class="btn sub" id="bk">きょうは ここまで</button>';
 G.innerHTML=h;
 document.getElementById('go').onclick=function(){S.floor>OPEN?screenGate():startFloor()};
 document.getElementById('bk').onclick=screenMap}

screenTitle();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})}</script>
</body>
</html>
