<style>
#game{max-width:460px;margin:0 auto;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#101a3a;border-radius:16px;padding:16px;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent;min-height:540px;box-sizing:border-box}
#game *{box-sizing:border-box}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:19px;font-weight:500;background:#2b4cb0;color:#fff;cursor:pointer;font-family:inherit;margin-top:10px}
.btn.sub{background:#22305e;font-size:15px;padding:11px}
.btn.gold{background:#a8791a}
.btn:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ans{border:2px solid #3d57a8;background:#1d2b5c;border-radius:12px;padding:18px 6px;font-size:26px;color:#fff;font-family:inherit;cursor:pointer;word-break:break-word;line-height:1.3;min-height:64px}
.ans.med{font-size:19px;padding:15px 8px;line-height:1.4}
.ans.small{font-size:15px;padding:12px 8px;line-height:1.45}
.ans.ok{background:#14684a;border-color:#3fd69a}
.ans.ng{background:#6d1b2c;border-color:#e0607a}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9fb3e6;gap:8px}
.bar{height:9px;background:#22305e;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#e05a7a;transition:width .25s}
.q{font-size:32px;text-align:center;margin:14px 0 4px;letter-spacing:1px}
.q.long{font-size:17px;line-height:1.6;letter-spacing:0;text-align:left;padding:0 4px}
.c{text-align:center}
.sm{font-size:13px;color:#9fb3e6}
.big{font-size:23px;font-weight:500}
.zone{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;margin-bottom:4px;background:#182449;color:#8ea4dd}
.zone.now{background:#2b4cb0;color:#fff}
.zone.locked{opacity:.45}
.zone b{font-weight:500;font-size:14px}
.pop{animation:pop .3s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:sh .3s}@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}100%{transform:translateX(0)}}
.combo{color:#ffd24a;font-size:15px;height:20px;text-align:center}
.inp{width:100%;padding:13px;border-radius:10px;border:2px solid #3d57a8;background:#1d2b5c;color:#fff;font-size:18px;font-family:inherit}
.reward{color:#ffd24a;font-size:13px;text-align:center;margin-top:4px}
.view{position:relative;border-radius:12px;overflow:hidden;background:#05070f;margin-top:8px}
.view canvas{display:block;width:100%}
.mini{position:absolute;right:8px;top:8px;border-radius:8px;opacity:.9}
.pad{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:10px}
.pad button{border:0;border-radius:12px;padding:16px 4px;font-size:16px;background:#2b4cb0;color:#fff;font-family:inherit;cursor:pointer}
.pad button:active{transform:translateY(1px)}
.tag{display:inline-block;background:#22305e;border-radius:999px;padding:4px 11px;font-size:12px;color:#9fb3e6;margin:2px}
.chestrow{display:flex;justify-content:center;gap:10px;margin:10px 0}
.lv{display:flex;gap:6px;margin-top:8px}
.lv button{flex:1;border:0;border-radius:10px;padding:10px 0;background:#22305e;color:#cdd9f5;font-size:14px;font-family:inherit;cursor:pointer}
</style>

function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function sh(a){for(var i=a.length-1;i>0;i--){var j=r(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function beep(f,d,ty){if(!snd)return;try{var c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());var o=c.createOscillator(),g=c.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}

function saveAll(a){try{localStorage.setItem('kashiko_v1',JSON.stringify(a))}catch(e){}}

function newSave(name){return {name:name,floor:1,max:1,lv:1,exp:0,gear:[],days:1,last:today(),clears:0,gold:0,ab:0,hb:0,hp:3}}
function fix(){if(S.gold==null)S.gold=0;if(S.ab==null)S.ab=0;if(S.hb==null)S.hb=0;if(S.hp==null)S.hp=maxhp()}
function maxhp(){return 3+Math.floor(S.lv/3)+(S.hb||0)}
function atk(){return 2+S.gear.length+(S.ab||0)}
function zoneOf(f){for(var i=0;i<ZONES.length;i++)if(f<=ZONES[i][1])return ZONES[i];return ZONES[9]}
function foeName(f){return FOE[Math.min(9,Math.floor((f-1)/10))]}

function subjOf(f){return (f-1)%3}
function subjName(f){return SUBJ[subjOf(f)]}
function stageOf(f){return Math.floor((f-1)/3)+1}
function subjTag(f){return '<span style="background:'+SUBJC[subjOf(f)]+';border-radius:999px;padding:2px 9px;font-size:12px;color:#fff">'+subjName(f)+'</span>'}

function P(a){return a.map(function(x){return x.split('|')})}
function pick4(ans,pool){var s={},o=[ans];s[ans]=1;
 var p=pool.slice();sh(p);
 for(var i=0;i<p.length&&o.length<4;i++){if(!s[p[i]]){s[p[i]]=1;o.push(p[i])}}
 var n=1;while(o.length<4){var v='？'+n;if(!s[v]){s[v]=1;o.push(v)}n++}
 return sh(o)}

function fr(n,d){return n+'/'+d}
function mkCh(ans,kind,cx){var s={},o=[ans];s[ans]=1;
 for(var g=0;g<120&&o.length<4;g++){var v=null;
  if(kind==='frac'){var p=cx.n+r(-3,3);if(p<1||p>cx.d||p===cx.n)continue;v=fr(p,cx.d)}
  else if(kind==='dec'){var x=Math.round(parseFloat(ans)*10)+r(-5,5);if(x<0)continue;v=(x/10).toFixed(1)}
  else{var n=parseInt(ans,10);var dd=r(1,Math.max(3,Math.round(Math.abs(n)*0.25)));var y=n+(r(0,1)?dd:-dd);if(y<0)continue;v=String(y)}
  if(v&&!s[v]){s[v]=1;o.push(v)}}
 var k=2;while(o.length<4){var f2=String(parseInt(ans,10)+k*7);if(!s[f2]){s[f2]=1;o.push(f2)}k++}
 return sh(o)}

function mathQ(f){var a,b,c,t,ans,kind='int',cx=null,lg=false;
 if(f<=3){if(r(0,1)){a=r(1,8);b=r(1,9-a);t=a+' + '+b;ans=a+b}else{a=r(3,10);b=r(1,a-1);t=a+' - '+b;ans=a-b}}
 else if(f<=6){if(r(0,1)){a=r(5,9);b=r(11-a,9);t=a+' + '+b;ans=a+b}else{a=r(11,18);b=r(a-9,9);t=a+' - '+b;ans=a-b}}
 else if(f<=10){a=r(2,9);b=r(2,9);t=a+' × '+b;ans=a*b}
 else if(f<=14){a=r(2,9);b=r(2,9);t=(a*b)+' ÷ '+a;ans=b}
 else if(f<=18){if(r(0,1)){a=r(13,89);b=r(11,99-a);t=a+' + '+b;ans=a+b}else{a=r(25,99);b=r(11,a-1);t=a+' - '+b;ans=a-b}}
 else if(f<=22){if(r(0,1)){a=r(12,49);b=r(3,9);t=a+' × '+b;ans=a*b}else{b=r(3,9);c=r(2,9);var am=r(1,b-1);t=(b*c+am)+' ÷ '+b+' の あまり';ans=am}}
 else if(f<=26){if(r(0,1)){a=r(20,80);c=a+r(12,90);t=a+' + □ = '+c;ans=c-a}else{a=r(101,499);b=r(101,499);t=a+' + '+b;ans=a+b}}
 else if(f<=30){kind='dec';a=r(1,9);b=r(1,9);if(r(0,1)){t=(a/10).toFixed(1)+' + '+(b/10).toFixed(1);ans=((a+b)/10).toFixed(1)}else{if(a<b){var tp=a;a=b;b=tp}t=(a/10).toFixed(1)+' - '+(b/10).toFixed(1);ans=((a-b)/10).toFixed(1)}}
 else if(f<=34){kind='frac';var d=r(4,9);a=r(1,d-2);b=r(1,d-a-1);if(b<1)b=1;t=fr(a,d)+' + '+fr(b,d);ans=fr(a+b,d);cx={n:a+b,d:d}}
 else{lg=true;var kk=r(1,5);
  if(kk===1){a=r(3,9);b=r(2,6);t='時速 '+a+'km で '+b+'時間 あるくと、なんkm すすむ？';ans=a*b}
  else if(kk===2){a=r(40,90);b=r(3,8);t='1こ '+a+'円 の あめを '+b+'こ かうと、いくら？';ans=a*b}
  else if(kk===3){b=r(3,8);c=r(4,12);t=(b*c)+'この あめを '+b+'人で 同じ数ずつ わけると、1人ぶんは なんこ？';ans=c}
  else if(kk===4){a=r(2,9)*100;b=r(1,4)*10;t=a+'円 の '+b+'% は いくら？';ans=a*b/100}
  else{b=r(3,6);c=r(3,9);t='全体の 1/'+b+' が '+c+'こ です。全体は なんこ？';ans=b*c}}
 ans=String(ans);
 return {t:t,ans:ans,ch:mkCh(ans,kind,cx),long:lg,eq:!lg}}

function kanjiQ(gi){var g=P(KJ[gi]),i=r(0,g.length-1);
 return {t:'「'+g[i][0]+'」 の よみかたは？',ans:g[i][1],ch:pick4(g[i][1],g.map(function(x){return x[1]}))}}

function narabeQ(){var m=NARABE.map(function(x){return x.split('|')}),i=r(0,m.length-1),p=m[i];
 var right=p.join(' ');

 var o=[right];

 for(i=0;i<w;i++){
  var a=D.pa-fov/2+fov*i/w,rr=cast(a),dist=Math.max(.05,rr.d*Math.cos(a-D.pa));
  var lh=Math.min(h*4,h/dist);zb[i]=dist;

  var tx=rr.wx,edge=(tx<.035||tx>.965)?.66:1,band=(Math.floor(tx*4)%2)?.92:1;
  ctx.fillStyle=shade(wc,sd*edge*band);ctx.fillRect(i,(h-lh)/2,1,lh)}

  if(e.t==='mon'&&!e.alive)continue;if(e.t==='chest'&&e.open)continue;
  var dx=e.x-D.px,dy=e.y-D.py,d2=Math.sqrt(dx*dx+dy*dy);
  var ang=Math.atan2(dy,dx)-D.pa;while(ang>Math.PI)ang-=2*Math.PI;while(ang<-Math.PI)ang+=2*Math.PI;

function cast(a){

  if(wall(nx,ny)){var fx=nx-Math.floor(nx),fy=ny-Math.floor(ny);
   var side=Math.min(fx,1-fx)<Math.min(fy,1-fy);
   return {d:d,side:side,wx:side?fy:fx}}}
 return {d:12,side:false,wx:0}}

 if(zb[col]!==undefined&&zb[col]<s.d-.25)return;
 var cy=h/2+sz*0.22,k=Math.max(.35,Math.min(1,1.3/s.d));
 if(s.e.t==='mon'){
  var base=['#5dcaa5','#97c459','#85b7eb','#b4b2a9','#5dcaa5','#ef9f27','#ffd24a','#af7fdd','#f0997b','#ffffff'][Math.min(9,Math.floor((D.f-1)/10))];
  var sc=s.e.boss?1.35:1;sz*=sc;
  ctx.fillStyle=shade(base,k);
  ctx.beginPath();ctx.ellipse(sx,cy,sz*.42,sz*.40,0,Math.PI,0);ctx.lineTo(sx-sz*.42,cy);ctx.closePath();ctx.fill();
  ctx.fillStyle='#101a3a';
  ctx.beginPath();ctx.arc(sx-sz*.16,cy-sz*.16,sz*.085,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(sx+sz*.16,cy-sz*.16,sz*.085,0,7);ctx.fill();
  if(s.e.boss){ctx.fillStyle='#ffd24a';ctx.font='bold '+Math.max(10,sz*.13)+'px sans-serif';ctx.textAlign='center';ctx.fillText('BOSS',sx,cy-sz*.5)}
 }else if(s.e.t==='chest'){
  ctx.fillStyle=shade('#a8791a',k);ctx.fillRect(sx-sz*.22,cy-sz*.26,sz*.44,sz*.26);
  ctx.fillStyle=shade('#6b4a12',k);ctx.fillRect(sx-sz*.22,cy-sz*.36,sz*.44,sz*.12);
  ctx.fillStyle=shade('#ffd24a',k);ctx.fillRect(sx-sz*.04,cy-sz*.30,sz*.08,sz*.12);
 }else{
  ctx.fillStyle=D.left>0?shade('#3a4a7a',k):shade('#ffd24a',k);
  ctx.beginPath();ctx.moveTo(sx-sz*.26,cy);ctx.lineTo(sx+sz*.26,cy);ctx.lineTo(sx+sz*.16,cy-sz*.42);ctx.lineTo(sx-sz*.16,cy-sz*.42);ctx.closePath();ctx.fill();
  ctx.fillStyle='#101a3a';ctx.font='bold '+Math.max(9,sz*.12)+'px sans-serif';ctx.textAlign='center';ctx.fillText(D.left>0?'× とじている':'かいだん',sx,cy-sz*.48)}}

function drawMini(){
 var s=mc._s,cell=s/D.w;
 mx.clearRect(0,0,s,s);mx.fillStyle='rgba(10,16,41,.75)';mx.fillRect(0,0,s,s);
 for(var y=0;y<D.h;y++)for(var x=0;x<D.w;x++){
  if(!D.seen[x+','+y])continue;
  mx.fillStyle=D.m[y][x]===1?'#2b3660':'#0e1731';mx.fillRect(x*cell,y*cell,cell,cell)}
 for(var i=0;i<D.ents.length;i++){var e=D.ents[i];
  var show=D.seen[e.x+','+e.y]||(e.t==='stair'&&D.left<=0);
  if(!show)continue;
  if(e.t==='mon'&&!e.alive)continue;if(e.t==='chest'&&e.open)continue;
  mx.fillStyle=e.t==='mon'?'#e0607a':(e.t==='chest'?'#ffd24a':(D.left>0?'#55608a':'#3fd69a'));
  mx.fillRect(e.x*cell+cell*.25,e.y*cell+cell*.25,cell*.5,cell*.5)}
 mx.fillStyle='#fff';mx.beginPath();mx.arc(D.px*cell+cell/2,D.py*cell+cell/2,cell*.28,0,7);mx.fill();
 mx.strokeStyle='#fff';mx.lineWidth=1.5;mx.beginPath();mx.moveTo(D.px*cell+cell/2,D.py*cell+cell/2);
 mx.lineTo(D.px*cell+cell/2+Math.cos(D.pa)*cell*.7,D.py*cell+cell/2+Math.sin(D.pa)*cell*.7);mx.stroke()}

function startBattle(e){document.onkeydown=null;
 B={e:e,f:D.f,boss:e.boss,fhp:e.boss?20:8,fmax:e.boss?20:8,combo:0,best:0,ok:0};
 B.q=makeQ(B.f);drawBattle()}

function drawBattle(fx){
 var z=zoneOf(B.f);
 var hearts='';for(var i=0;i<maxhp();i++)hearts+=(i<S.hp?'<span style="color:#e0607a">♥</span>':'<span style="color:#3a4a7a">♥</span>');
 var h='<div class="hud"><span>'+B.f+'かい　'+subjTag(B.f)+'</span><span>'+hearts+'</span></div>';
 h+='<div class="sm" style="margin-top:10px">'+(B.boss?'ボス ':'')+foeName(B.f)+'</div><div class="bar"><i style="width:'+(B.fhp/B.fmax*100)+'%"></i></div>';
 h+='<div class="reward">たおすと：たからばこ '+(B.boss?'2つ ＋ そうび':'1つ')+'</div>';
 h+='<div class="c '+(fx==='hit'?'pop':(fx==='miss'?'shake':''))+'" style="margin:2px 0">'+foeSvg(B.f,fx==='hit')+'</div>';
 h+='<div class="combo">'+(B.combo>=3?'かいしんの いちげき！　'+B.combo+'れんぞく':(B.combo===2?'あと1つで かいしん':''))+'</div>';
 h+='<div class="q'+(B.q.long?' long':'')+'">'+B.q.t+(B.q.eq?' = ?':'')+'</div>';
 var lm=0;B.q.ch.forEach(function(v){lm=Math.max(lm,String(v).length)});
 var sz=lm<=6?'':(lm<=12?' med':' small');
 h+='<div class="grid">'+B.q.ch.map(function(v){return '<button class="ans'+sz+'" data-v="'+String(v).replace(/"/g,'&quot;')+'">'+v+'</button>'}).join('')+'</div>';
 h+='<button class="btn sub" id="run">にげる</button>';
 G.innerHTML=h;
 G.querySelectorAll('.ans').forEach(function(b){b.onclick=function(){answer(b.dataset.v,b)}});
 document.getElementById('run').onclick=function(){drawDungeon()}}

function answer(v,el){
 G.querySelectorAll('.ans').forEach(function(b){b.onclick=null});
 if(v===B.q.ans){el.className='ans ok';beep(880,.08);B.combo++;B.ok++;if(B.combo>B.best)B.best=B.combo;
  B.fhp-=atk()*(B.combo>=3?2:1);
  setTimeout(function(){if(B.fhp<=0)return winBattle();B.q=makeQ(B.f);drawBattle('hit')},280)}
 else{el.className='ans ng';beep(160,.18,'sawtooth');B.combo=0;S.hp--;
  var t=G.querySelector('.q');if(t)t.innerHTML=B.q.t+(B.q.eq?' = ':'　→ ')+'<span style="color:#ffd24a">'+B.q.ans+'</span>';
  setTimeout(function(){if(S.hp<=0)return lose();B.q=makeQ(B.f);drawBattle('miss')},1500)}}

function lose(){
 G.innerHTML='<div class="c" style="padding:26px 0"><div class="big">にげかえった</div><div class="sm" style="margin-top:10px">'+B.f+'かいの まもの は つよかった。<br>たおした まもの と そうび は きえない。</div></div><button class="btn" id="re">'+B.f+'かいの 入口から</button><button class="btn sub" id="bk">地図に もどる</button>';
 S.hp=maxhp();save();
 document.getElementById('re').onclick=function(){D.px=1;D.py=1;D.pa=0;markSeen();drawDungeon()};
 document.getElementById('bk').onclick=screenMap}

function winBattle(){
 beep(660,.1);setTimeout(function(){beep(990,.16)},120);
 B.e.alive=false;D.left--;S.clears++;
 var ex=B.f*6+B.ok*4;S.exp+=ex;var up=false;
 while(S.exp>=S.lv*100){S.exp-=S.lv*100;S.lv++;up=true;S.hp=maxhp()}
 var extra=up?'レベルが '+S.lv+' に あがった！　♥が ふえた':'';
 var n=B.boss?2:1,gearGot=null;
 if(B.boss){var g=freeGear();if(g){S.gear.push(g);gearGot=g}}
 save();
 screenChest(n,foeName(B.f)+' を たおした！'+(gearGot?'　そうび「'+gearGot+'」！':''),function(){
  if(extra)return levelUpScreen(extra);
  afterBattle()})}

function levelUpScreen(msg){
 G.innerHTML='<div class="c" style="padding:40px 0"><div class="big" style="color:#ffd24a">'+msg+'</div></div><button class="btn" id="g">つづける</button>';
 document.getElementById('g').onclick=afterBattle}

function afterBattle(){var op=(D.left<=0);drawDungeon();if(op)setTimeout(function(){toast('かいだんが ひらいた！')},60)}

function screenChest(n,title,done){
 var got=[],i;for(i=0;i<n;i++)got.push(rollLoot());
 save();
 var h='<div class="c" style="padding:14px 0 4px"><div class="big">'+title+'</div><div class="sm" style="margin-top:8px">たからばこ '+n+'つ</div></div>';
 h+='<div class="chestrow" id="cr">'+got.map(function(){return '<svg viewBox="0 0 60 50" width="72" height="60"><rect x="6" y="18" width="48" height="26" rx="4" fill="#a8791a"/><rect x="6" y="10" width="48" height="12" rx="4" fill="#6b4a12"/><rect x="26" y="16" width="8" height="14" rx="2" fill="#ffd24a"/></svg>'}).join('')+'</div>';
 h+='<button class="btn gold" id="op">あける</button>';
 G.innerHTML=h;
 document.getElementById('op').onclick=function(){
  beep(740,.1);setTimeout(function(){beep(1100,.14)},110);
  var hh='<div class="c" style="padding:14px 0 4px"><div class="big">'+title+'</div></div><div class="c pop" style="margin:14px 0">';
  hh+=got.map(function(g){return '<div style="margin:10px 0"><div style="font-size:21px;color:#ffd24a">'+g.n+'</div><div class="sm">'+g.d+'</div></div>'}).join('');
  hh+='</div><div class="sm c">きんか '+S.gold+'　こうげき '+atk()+'　♥ '+S.hp+'/'+maxhp()+'</div><button class="btn" id="nx">つづける</button>';
  G.innerHTML=hh;document.getElementById('nx').onclick=done}}

function clearFloor(){
 var nf=D.f+1;S.floor=nf;if(nf>S.max)S.max=nf;S.hp=maxhp();save();
 screenChest(1,D.f+'かい クリア！　かいだんを のぼった',function(){
  var nb=(nf%5===0);
  var h='<div class="c" style="padding:18px 0 4px"><div class="big">つぎは '+nf+' かい</div>';
  h+='<div style="margin:10px 0">'+(nf>OPEN?'':subjTag(nf))+'</div>';
  h+='<div class="sm">'+(nf>OPEN?'…かたい とびらが ある':(nb?'★ボスが まっている（たからばこ 2つ ＋ そうび）':zoneOf(nf)[2]+'　まもの 3たい'))+'</div>';
  h+='<div class="sm" style="margin-top:8px">♥ が ぜんかいした</div></div>';
  h+='<button class="btn" id="go">'+nf+'かいへ すすむ</button><button class="btn sub" id="bk">きょうは ここまで</button>';
  G.innerHTML=h;
  document.getElementById('go').onclick=function(){enterFloor(nf)};
  document.getElementById('bk').onclick=screenMap})}

window.addEventListener('resize',function(){if(cv&&D&&document.getElementById('cv')){sizeCanvas();render()}});
screenTitle();

})();
</script>
